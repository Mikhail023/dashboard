name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-2025
            platform: windows
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run compile
      - run: npm run test:smoke
      - run: npm run test:acceptance
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release.mjs
      - name: Package macOS
        if: matrix.platform == 'mac'
        run: npx electron-builder --config mac/electron-builder.yml --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package Windows
        if: matrix.platform == 'windows'
        run: npx electron-builder --config windows/electron-builder.yml --win --x64 --publish never
      - name: Smoke-test installed payload (macOS)
        if: matrix.platform == 'mac'
        run: npm run test:smoke
        env:
          DASHBOARD_EXECUTABLE: ${{ github.workspace }}/release/mac/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/Dashboard.app/Contents/MacOS/Dashboard
      - name: Smoke-test installed payload (Windows)
        if: matrix.platform == 'windows'
        run: npm run test:smoke
        env:
          DASHBOARD_EXECUTABLE: ${{ github.workspace }}\release\windows\win-unpacked\Dashboard.exe
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/${{ matrix.platform }}/*.dmg
            release/${{ matrix.platform }}/*.zip
            release/${{ matrix.platform }}/*.exe
            release/${{ matrix.platform }}/*.blockmap
            release/${{ matrix.platform }}/*.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidence-${{ matrix.platform }}-${{ matrix.arch }}
          path: .qa/acceptance
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: dashboard-*
          path: release-artifacts
      - run: npm ci --ignore-scripts
      - name: Merge macOS update manifests
        run: node scripts/merge-update-manifests.mjs release-artifacts
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Dashboard $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          find release-artifacts -type f ! -name 'latest-mac.yml' -exec gh release upload "$GITHUB_REF_NAME" --clobber {} +
          gh release upload "$GITHUB_REF_NAME" release-artifacts/latest-mac.yml --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
