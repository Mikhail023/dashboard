extends: build/electron-builder.json
directories:
  output: release/windows
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Dashboard-Setup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
